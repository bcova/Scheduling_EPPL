<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>EPPL Desk Scheduler</title>
<style>
:root {
  --bg: #f4f5f7; --card: #ffffff; --ink: #1f2937; --muted: #6b7280; --line: #e5e7eb;
  --accent: #0f766e; --accent-soft: #ccfbf1;
  --bad: #dc2626; --bad-soft: #fee2e2; --warn: #d97706; --warn-soft: #fef3c7; --ok: #16a34a; --ok-soft: #dcfce7;
  --radius: 10px;
}
body[data-dept="YS"] { --accent: #c2410c; --accent-soft: #ffedd5; }
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); background: var(--bg); display: flex; flex-direction: column; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }

/* ---------- top bar ---------- */
.top { display: flex; align-items: center; gap: 14px; padding: 10px 16px; background: var(--card); border-bottom: 3px solid var(--accent); flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { font-size: 26px; }
.brand b { display: block; font-size: 16px; }
.brand small { color: var(--muted); }
.seg { display: inline-flex; background: var(--bg); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 999px; font-weight: 600; color: var(--muted); }
.seg button.on { background: var(--accent); color: #fff; }
.tabs { display: inline-flex; gap: 4px; }
.tabs button { border: 0; background: transparent; padding: 6px 12px; border-bottom: 2px solid transparent; font-weight: 600; color: var(--muted); }
.tabs button.on { color: var(--ink); border-bottom-color: var(--accent); }
.me { margin-left: auto; text-align: right; font-size: 12px; color: var(--muted); }
.pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11px; font-weight: 700; }
.pill.edit { background: var(--ok-soft); color: #166534; }
.pill.view { background: var(--bg); color: var(--muted); border: 1px solid var(--line); }

/* ---------- toolbar ---------- */
.toolbar { display: flex; align-items: center; gap: 8px; padding: 10px 16px; flex-wrap: wrap; }
.btn { border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 6px 12px; font-weight: 600; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn.primary:hover:not(:disabled) { color: #fff; filter: brightness(1.08); }
.btn.danger { color: var(--bad); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.weeklabel { font-weight: 700; font-size: 16px; margin: 0 6px; min-width: 150px; }
.spacer { flex: 1; }
.chk { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 12px; }
.badge.bad { background: var(--bad-soft); color: #991b1b; }
.badge.warn { background: var(--warn-soft); color: #92400e; }
.badge.ok { background: var(--ok-soft); color: #166534; }

#banner > div { margin: 0 16px 8px; padding: 8px 12px; border-radius: 8px; font-weight: 500; }
#banner .info { background: var(--warn-soft); color: #92400e; }
#banner .err { background: var(--bad-soft); color: #991b1b; }

main { flex: 1; min-height: 0; padding: 0 16px 16px; display: flex; }
.layout { display: flex; gap: 14px; flex: 1; min-height: 0; width: 100%; }
.gridwrap { flex: 1; min-width: 0; overflow: auto; background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); position: relative; }
.side { width: 270px; flex: none; overflow: auto; display: flex; flex-direction: column; gap: 12px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; }
.card h3 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }

/* ---------- the grid ---------- */
.grid { display: grid; grid-template-columns: 54px repeat(var(--cols), minmax(150px, 1fr)); min-width: 0; }
.corner, .dayhead { position: sticky; top: 0; z-index: 5; background: var(--card); border-bottom: 1px solid var(--line); }
.dayhead { padding: 8px 6px; text-align: center; border-left: 1px solid var(--line); }
.dayhead span { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; }
.dayhead b { display: block; font-size: 18px; }
.dayhead.today b { color: var(--accent); }
.dayhead.today::after { content: "TODAY"; font-size: 9px; font-weight: 800; color: #fff; background: var(--accent); border-radius: 4px; padding: 0 5px; }
.dayhead.closed b { color: var(--muted); text-decoration: line-through; }
.dayhead .to { display: block; font-size: 11px; color: #7c3aed; margin-top: 2px; }
.timecol { position: relative; font-size: 11px; color: var(--muted); }
.timecol i { position: absolute; right: 6px; font-style: normal; margin-top: 2px; }
.daycol { position: relative; border-left: 1px solid var(--line); user-select: none;
  background-image: linear-gradient(to bottom, var(--line) 1px, transparent 1px); background-size: 100% var(--pph); }
.daycol .offhours { position: absolute; left: 0; right: 0; background: rgba(107,114,128,.10); pointer-events: none; }
.daycol.closed { background-color: #f3f4f6; }
.daycol .closedlbl { position: absolute; top: 40%; left: 0; right: 0; text-align: center; color: var(--muted); font-weight: 700; transform: rotate(-12deg); pointer-events: none; }
.cov { position: absolute; left: 0; width: 6px; top: 0; bottom: 0; }
.cov i { position: absolute; left: 0; right: 0; }
.cov .g { background: var(--ok); } .cov .r { background: var(--bad); } .cov .a { background: var(--warn); }
.proglane { position: absolute; left: 9px; width: 44%; top: 0; bottom: 0; }
.shiftlane { position: absolute; left: calc(9px + 44% + 3px); right: 3px; top: 0; bottom: 0; cursor: cell; }
body.ro .shiftlane { cursor: default; }
.prog { position: absolute; border-left: 3px solid #9ca3af; border-radius: 4px; padding: 2px 4px; overflow: hidden; font-size: 11px; line-height: 1.25; color: #374151;
  background: repeating-linear-gradient(45deg, #e5e7eb, #e5e7eb 6px, #f3f4f6 6px, #f3f4f6 12px); }
.prog b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.prog span { color: var(--muted); }
.prog.mine { border-left-color: var(--accent); outline: 2px solid var(--accent); background: var(--accent-soft); }
.prog.dim { opacity: .35; }
.prog.other { border-left-style: dotted; opacity: .7; }
.blk { position: absolute; border-radius: 6px; padding: 3px 6px; color: #fff; background: var(--c); overflow: hidden; font-size: 12px; line-height: 1.25; box-shadow: 0 1px 2px rgba(0,0,0,.2); border: 2px solid transparent; cursor: grab; }
body.ro .blk { cursor: pointer; }
.blk .bn { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.blk .bt { opacity: .9; font-size: 11px; }
.blk.problem { border-color: var(--bad); box-shadow: 0 0 0 2px var(--bad-soft), 0 1px 2px rgba(0,0,0,.3); }
.blk.warn { border-color: var(--warn); }
.blk.bad { border-color: var(--bad); box-shadow: 0 0 0 3px var(--bad-soft); }
.blk.dim { opacity: .3; }
.blk.focus { outline: 2px solid var(--ink); }
.blk.dragging { opacity: .85; z-index: 20; cursor: grabbing; }
.blk.ghost { background: var(--accent); opacity: .75; pointer-events: none; z-index: 20; }
.blk .h { position: absolute; left: 0; right: 0; height: 7px; cursor: ns-resize; }
.blk .h.ht { top: 0; } .blk .h.hb { bottom: 0; }
body.ro .blk .h { display: none; }

/* ---------- sidebar ---------- */
.person { display: flex; align-items: center; gap: 8px; padding: 5px 6px; border-radius: 8px; cursor: pointer; }
.person:hover { background: var(--bg); }
.person.on { background: var(--accent-soft); }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c); flex: none; }
.person .nm { flex: 1; font-weight: 600; }
.meter { width: 70px; height: 7px; background: var(--line); border-radius: 99px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--ok); }
.meter.warn i { background: var(--warn); } .meter.bad i { background: var(--bad); }
.person small { color: var(--muted); min-width: 34px; text-align: right; }
.issue { padding: 6px 8px; border-radius: 8px; margin-bottom: 6px; border-left: 4px solid var(--warn); background: var(--warn-soft); cursor: pointer; font-size: 12.5px; }
.issue.Problem { border-left-color: var(--bad); background: var(--bad-soft); }
.issue.Note { border-left-color: #9ca3af; background: var(--bg); }
.issue small { display: block; color: var(--muted); }
.empty { color: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 10px; font-size: 12px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* ---------- my shifts ---------- */
.my { max-width: 720px; margin: 0 auto; width: 100%; overflow: auto; }
.myday { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
.myday h4 { margin: 0; padding: 8px 12px; background: var(--bg); display: flex; justify-content: space-between; }
.myday.today h4 { background: var(--accent-soft); }
.myitem { padding: 8px 12px; display: flex; gap: 10px; border-top: 1px solid var(--line); align-items: center; }
.myitem .t { min-width: 120px; font-weight: 700; }
.tag { font-size: 11px; font-weight: 700; padding: 1px 7px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); }
.tag.prog { background: #e5e7eb; color: #374151; position: static; border: 0; padding: 1px 7px; }

/* ---------- dialog / toast ---------- */
dialog { border: 0; border-radius: 14px; padding: 0; width: min(420px, calc(100vw - 24px)); box-shadow: 0 20px 50px rgba(0,0,0,.3); }
dialog::backdrop { background: rgba(0,0,0,.4); }
dialog form { padding: 18px; display: grid; gap: 12px; }
dialog h2 { margin: 0; font-size: 18px; }
dialog label { display: grid; gap: 4px; font-weight: 600; font-size: 12px; color: var(--muted); }
dialog input, dialog select, dialog textarea { border: 1px solid var(--line); border-radius: 8px; padding: 8px; font-weight: 400; color: var(--ink); width: 100%; }
dialog .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
dialog .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }
dialog .acts .left { margin-right: auto; }
#conf { min-height: 20px; font-size: 12.5px; }
#conf .c { background: var(--bad-soft); color: #991b1b; padding: 6px 8px; border-radius: 8px; margin-bottom: 4px; }
#conf .ok { color: var(--ok); }
#hint { position: fixed; z-index: 100; pointer-events: none; background: #111827; color: #fff; padding: 5px 9px; border-radius: 8px; font-size: 12px; max-width: 320px; display: none; }
#hint.bad { background: var(--bad); }
#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: #111827; color: #fff; padding: 9px 16px; border-radius: 10px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 200; max-width: 90vw; }
#toast.show { opacity: 1; } #toast.err { background: var(--bad); }
#loading { position: absolute; inset: 0; background: rgba(255,255,255,.65); display: none; align-items: center; justify-content: center; font-weight: 700; z-index: 30; }
#loading.on { display: flex; }

/* ---------- phones ---------- */
.daypills { display: none; gap: 6px; padding: 0 16px 8px; overflow-x: auto; }
.daypills button { border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 6px 10px; min-width: 52px; font-weight: 600; }
.daypills button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
@media (max-width: 820px) {
  .layout { flex-direction: column; flex: none; }
  .gridwrap { flex: none; overflow: visible; }
  .corner, .dayhead { top: 0; }
  .side { width: 100%; overflow: visible; }
  .daypills { display: flex; }
  .grid { grid-template-columns: 44px 1fr; }
  .me { width: 100%; text-align: left; margin-left: 0; }
  main { overflow: auto; }
}
</style>
</head>
<body data-dept="YS">

<header class="top">
  <div class="brand"><span class="logo">📚</span><div><b>EPPL Desk Scheduler</b><small id="sub">Elmwood Park Public Library</small></div></div>
  <div class="seg" id="deptSeg"><button data-dept="AS">Adult Services</button><button data-dept="YS">Youth Services</button></div>
  <nav class="tabs" id="viewTabs"><button data-view="schedule">Schedule</button><button data-view="my">My Shifts</button></nav>
  <div class="me" id="me"></div>
</header>
<section class="toolbar" id="toolbar"></section>
<div class="daypills" id="daypills"></div>
<div id="banner"></div>
<main id="main"></main>

<dialog id="dlg"></dialog>
<div id="hint"></div>
<div id="toast"></div>

<!--DEV_MOCK-->
<script>
(function () {
'use strict';

/* =============== tiny utilities =============== */
var DAYS = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
var DAYS3 = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
var MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
var PPH = 46;               // pixels per hour
var PPM = PPH / 60;         // pixels per minute
var SNAP = 15;              // minutes

function pad(n) { return n < 10 ? '0' + n : '' + n; }
function utc(k) { var p = k.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2])); }
function addDays(k, n) { var d = utc(k); d.setUTCDate(d.getUTCDate() + n); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); }
function dow(k) { return utc(k).getUTCDay(); }
function weekStart(k) { return addDays(k, -dow(k)); }
function md(k) { return (+k.slice(5, 7)) + '/' + (+k.slice(8)); }
function nice(k) { return MONTHS[+k.slice(5, 7) - 1] + ' ' + (+k.slice(8)); }
function fmt(min) { var h = Math.floor(min / 60) % 24, m = min % 60; return ((h % 12) || 12) + ':' + pad(m) + ' ' + (h >= 12 ? 'PM' : 'AM'); }
function fmtS(min) { var h = Math.floor(min / 60) % 24, m = min % 60; return ((h % 12) || 12) + (m ? ':' + pad(m) : '') + (h >= 12 ? 'p' : 'a'); }
function toInput(min) { return pad(Math.floor(min / 60)) + ':' + pad(min % 60); }
function fromInput(v) { var p = String(v).split(':'); return (+p[0]) * 60 + (+p[1] || 0); }
function snap(m) { return Math.round(m / SNAP) * SNAP; }
function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
function overlap(a1, a2, b1, b2) { return a1 < b2 && a2 > b1; }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function norm(s) { return String(s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
function color(name) { var h = 0, s = norm(name); for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360; return 'hsl(' + h + ' 52% 38%)'; }
function $(id) { return document.getElementById(id); }
function store(k, v) { try { if (v === undefined) return localStorage.getItem('eppl.' + k); localStorage.setItem('eppl.' + k, v); } catch (e) { return null; } }

function call(name) {
  var args = [].slice.call(arguments, 1);
  return new Promise(function (resolve, reject) {
    if (window.__mock) { window.__mock[name].apply(null, args).then(resolve, reject); return; }
    var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(function (e) { reject(e); });
    r[name].apply(r, args);
  });
}

var toastTimer;
function toast(msg, isErr) {
  var t = $('toast'); t.textContent = msg; t.className = 'show' + (isErr ? ' err' : '');
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.className = ''; }, isErr ? 5000 : 2600);
}
function errMsg(e) { return (e && e.message) ? String(e.message).replace(/^Error:\s*/, '') : String(e); }

/* =============== state =============== */
var S = { boot: null, dept: 'AS', view: 'schedule', weekStart: null, week: null, focus: null, showOther: false, who: null, mobileDay: 0, busy: false, error: '' };
var mobile = window.matchMedia('(max-width: 820px)');
var drag = null, suppressClick = false;

function me() { return S.boot.me; }
function canEdit() { return !!me().edit[S.dept]; }
function deptStaff(dept) { return S.boot.staff.filter(function (p) { return p.dept === dept || p.dept === 'Both'; }); }

/* =============== loading =============== */
function loadWeek(anyDay) {
  S.busy = true; S.error = '';
  renderAll();
  return call('api_week', anyDay || S.weekStart).then(function (w) {
    S.week = w; S.weekStart = w.start; S.busy = false; renderAll();
  }).catch(function (e) { S.busy = false; S.error = errMsg(e); renderAll(); });
}
function applyWeek(w) { S.week = w; S.weekStart = w.start; S.busy = false; renderAll(); }
function fail(e) { S.busy = false; toast(errMsg(e), true); renderAll(); }

/* =============== schedule math =============== */
function hoursOf(date) { return S.boot.hours[DAYS[dow(date)]] || null; }
function isClosed(date) { return S.week.closures.indexOf(date) >= 0 || !hoursOf(date); }
function needOf(dept, date) { return ((S.boot.coverage[dept] || {})[DAYS[dow(date)]]) || 0; }

function range() {
  var o = 1440, c = 0;
  Object.keys(S.boot.hours).forEach(function (d) { o = Math.min(o, S.boot.hours[d].open); c = Math.max(c, S.boot.hours[d].close); });
  if (o >= c) { o = 540; c = 1260; }
  (S.week ? S.week.shifts : []).forEach(function (s) { o = Math.min(o, s.start); c = Math.max(c, s.end); });
  return { o: Math.floor(o / 60) * 60, c: Math.ceil(c / 60) * 60 };
}

/** Live conflict check for a shift-in-progress (same ideas as the server checker). */
function conflictsFor(sh) {
  var out = [], W = S.week; if (!W || !sh.name) return out;
  if (W.closures.indexOf(sh.date) >= 0) out.push('Library is closed that day');
  else if (!hoursOf(sh.date)) out.push('Library is closed on ' + DAYS[dow(sh.date)] + 's');
  else { var h = hoursOf(sh.date); if (sh.start < h.open || sh.end > h.close) out.push('Outside open hours (' + fmt(h.open) + '–' + fmt(h.close) + ')'); }
  W.programs.forEach(function (p) {
    if (p.date === sh.date && p.staff.indexOf(sh.name) >= 0 && overlap(sh.start, sh.end, p.busyStart, p.busyEnd)) {
      out.push(sh.name + ' is running “' + p.name + '” (' + fmt(p.busyStart) + '–' + fmt(p.busyEnd) + ')');
    }
  });
  W.timeOff.forEach(function (t) { if (t.name === sh.name && sh.date >= t.start && sh.date <= t.end) out.push(sh.name + ' has time off'); });
  W.shifts.forEach(function (o) {
    if (o.id !== sh.id && o.name === sh.name && o.date === sh.date && overlap(sh.start, sh.end, o.start, o.end)) out.push('Double-booked with another ' + o.dept + ' shift');
  });
  return out;
}

function lanes(items, sKey, eKey) {
  var sorted = items.slice().sort(function (a, b) { return a[sKey] - b[sKey] || a[eKey] - b[eKey]; });
  var cols = [], res = [];
  sorted.forEach(function (it) {
    var placed = -1;
    for (var i = 0; i < cols.length; i++) if (cols[i] <= it[sKey]) { placed = i; break; }
    if (placed < 0) { cols.push(0); placed = cols.length - 1; }
    cols[placed] = it[eKey];
    res.push({ it: it, lane: placed });
  });
  // lane count = max overlap cluster size (simple + good enough)
  res.forEach(function (r) {
    var n = 1;
    res.forEach(function (o) { if (overlap(r.it[sKey], r.it[eKey], o.it[sKey], o.it[eKey])) n = Math.max(n, o.lane + 1); });
    r.n = Math.max(n, r.lane + 1);
  });
  return res;
}

function weekHours(name) {
  var t = 0;
  S.week.shifts.forEach(function (s) { if (s.name === name) t += (s.end - s.start) / 60; });
  return t;
}

/* =============== rendering: chrome =============== */
function visibleDays() {
  var d = S.week ? S.week.days : [];
  if (mobile.matches && d.length) return [d[clamp(S.mobileDay, 0, 6)]];
  return d;
}

function renderChrome() {
  var b = S.boot;
  document.body.dataset.dept = S.dept;
  document.body.classList.toggle('ro', S.view === 'schedule' && !canEdit());
  Array.prototype.forEach.call($('deptSeg').children, function (x) { x.classList.toggle('on', x.dataset.dept === S.dept); });
  Array.prototype.forEach.call($('viewTabs').children, function (x) { x.classList.toggle('on', x.dataset.view === S.view); });
  $('deptSeg').style.display = S.view === 'schedule' ? '' : 'none';
  var m = me();
  $('me').innerHTML = (m.name ? '<b>' + esc(m.name) + '</b> · ' : (m.email ? esc(m.email) + ' · ' : '')) +
    '<span class="pill ' + (canEdit() && S.view === 'schedule' ? 'edit' : 'view') + '">' + (S.view === 'schedule' ? (canEdit() ? 'Can edit ' + S.dept : 'View only') : 'View only') + '</span>';

  var w = S.week, label = w ? nice(w.start) + ' – ' + nice(w.end) + ', ' + w.end.slice(0, 4) : '…';
  var probs = 0, warns = 0;
  if (w) w.warnings.forEach(function (x) { if (x.dept !== S.dept) return; if (x.severity === 'Problem') probs++; else if (x.severity === 'Warning') warns++; });
  var html = '<button class="btn" id="prev">‹</button><button class="btn" id="today">Today</button><button class="btn" id="next">›</button>' +
    '<span class="weeklabel">' + esc(label) + '</span>';
  if (S.view === 'schedule' && w) {
    html += probs || warns ? '<span class="badge ' + (probs ? 'bad' : 'warn') + '">' + (probs ? probs + ' problem' + (probs > 1 ? 's' : '') : '') + (probs && warns ? ' · ' : '') + (warns ? warns + ' warning' + (warns > 1 ? 's' : '') : '') + '</span>'
      : '<span class="badge ok">✓ No problems</span>';
  }
  html += '<span class="spacer"></span>';
  if (S.view === 'schedule') {
    html += '<label class="chk"><input type="checkbox" id="showOther"' + (S.showOther ? ' checked' : '') + '> Show other desk’s programs</label>';
    html += '<button class="btn" id="btnRefresh" title="Re-read the programs sheet"' + (me().edit.AS || me().edit.YS ? '' : ' disabled') + '>⟳ Refresh programs</button>';
    html += '<button class="btn primary" id="btnPublish"' + (canEdit() && b.calendarSet ? '' : ' disabled') + ' title="' + (b.calendarSet ? 'Send this week’s ' + S.dept + ' shifts to Google Calendar' : 'Add a Calendar ID on the Settings tab first') + '">📅 Publish ' + S.dept + ' week</button>';
  }
  $('toolbar').innerHTML = html;

  var banner = '';
  if (S.error) banner += '<div class="err">⚠ ' + esc(S.error) + '</div>';
  if (!b.lastRefresh) banner += '<div class="info">Programs haven’t been loaded yet, so program blocks and conflict checks are empty. ' + (me().edit.AS || me().edit.YS ? 'Click “Refresh programs”.' : 'Ask a scheduler to refresh them.') + '</div>';
  $('banner').innerHTML = banner;

  var pills = '';
  if (mobile.matches && w) w.days.forEach(function (d, i) { pills += '<button data-i="' + i + '" class="' + (i === S.mobileDay ? 'on' : '') + '">' + DAYS3[i] + '<br>' + md(d) + '</button>'; });
  $('daypills').innerHTML = pills;
}

/* =============== rendering: schedule =============== */
function renderSchedule() {
  var W = S.week, dept = S.dept;
  if (!W) { $('main').innerHTML = '<div class="gridwrap"><div id="loading" class="on">Loading…</div></div>'; return; }
  var R = range(), H = (R.c - R.o) * PPM, days = visibleDays();
  var g = '<div class="layout"><div class="gridwrap"><div id="loading"' + (S.busy ? ' class="on"' : '') + '>Working…</div>' +
    '<div class="grid" style="--cols:' + days.length + ';--pph:' + PPH + 'px"><div class="corner"></div>';

  days.forEach(function (d) {
    var offs = W.timeOff.filter(function (t) { return d >= t.start && d <= t.end; }).map(function (t) { return t.name; });
    g += '<div class="dayhead' + (d === S.boot.today ? ' today' : '') + (isClosed(d) ? ' closed' : '') + '"><span>' + DAYS3[dow(d)] + '</span><b>' + md(d) + '</b>' +
      (offs.length ? '<small class="to">🏖 ' + esc(offs.join(', ')) + '</small>' : '') + '</div>';
  });

  g += '<div class="timecol" style="height:' + H + 'px">';
  for (var m = R.o; m <= R.c; m += 60) g += '<i style="top:' + ((m - R.o) * PPM) + 'px">' + fmtS(m).replace(/a|p/, function (x) { return x === 'a' ? 'am' : 'pm'; }) + '</i>';
  g += '</div>';

  days.forEach(function (d) { g += dayCol(d, R, H); });
  g += '</div></div>' + sidebar() + '</div>';
  $('main').innerHTML = g;
}

function dayCol(d, R, H) {
  var W = S.week, dept = S.dept, closed = isClosed(d), hrs = hoursOf(d);
  var s = '<div class="daycol' + (closed ? ' closed' : '') + '" data-date="' + d + '" style="height:' + H + 'px">';
  if (closed) {
    s += '<div class="closedlbl">Closed</div>';
  } else {
    if (hrs.open > R.o) s += '<div class="offhours" style="top:0;height:' + ((hrs.open - R.o) * PPM) + 'px"></div>';
    if (hrs.close < R.c) s += '<div class="offhours" style="top:' + ((hrs.close - R.o) * PPM) + 'px;height:' + ((R.c - hrs.close) * PPM) + 'px"></div>';
    // coverage strip
    var need = needOf(dept, d);
    if (need) {
      var seg = '', run = null;
      var myShifts = W.shifts.filter(function (x) { return x.dept === dept && x.date === d; });
      var flush = function () { if (run) seg += '<i class="' + run.c + '" style="top:' + ((run.a - R.o) * PPM) + 'px;height:' + ((run.b - run.a) * PPM) + 'px" title="' + run.n + ' on desk (need ' + need + ')"></i>'; run = null; };
      for (var t = hrs.open; t < hrs.close; t += 30) {
        var n = 0; myShifts.forEach(function (x) { if (overlap(x.start, x.end, t, t + 30)) n++; });
        var c = n >= need ? 'g' : (n === 0 ? 'r' : 'a');
        if (run && run.c === c && run.n === n) run.b = t + 30; else { flush(); run = { a: t, b: t + 30, c: c, n: n }; }
      }
      flush(); s += '<div class="cov">' + seg + '</div>';
    }
  }
  // programs (left lane)
  var progs = W.programs.filter(function (p) { return p.date === d && (p.dept === dept || S.showOther); });
  s += '<div class="proglane">';
  lanes(progs, 'busyStart', 'busyEnd').forEach(function (r) {
    var p = r.it, mine = S.focus && p.staff.indexOf(S.focus) >= 0;
    s += '<div class="prog' + (mine ? ' mine' : '') + (S.focus && !mine ? ' dim' : '') + (p.dept !== dept ? ' other' : '') + '" style="top:' + ((p.busyStart - R.o) * PPM) + 'px;height:' + Math.max((p.busyEnd - p.busyStart) * PPM, 16) + 'px;left:' + (r.lane / r.n * 100) + '%;width:' + (100 / r.n) + '%" title="' +
      esc(p.name + ' · ' + fmt(p.busyStart) + '–' + fmt(p.busyEnd) + ' (incl. setup/teardown)' + (p.room ? ' · ' + p.room : '') + (p.staff.length ? ' · ' + p.staff.join(', ') : '')) + '"><b>' + esc(p.name) + '</b><span>' + esc(p.staff.join(', ')) + '</span></div>';
  });
  s += '</div>';
  // shifts (right lane)
  s += '<div class="shiftlane">';
  var shifts = W.shifts.filter(function (x) { return x.dept === dept && x.date === d; });
  lanes(shifts, 'start', 'end').forEach(function (r) { s += blockHtml(r.it, R, r.lane / r.n * 100, 100 / r.n); });
  s += '</div></div>';
  return s;
}

function shiftIssues(id) { return S.week.warnings.filter(function (w) { return w.shiftId === id; }); }

function blockHtml(sh, R, left, width) {
  var iss = shiftIssues(sh.id), sev = iss.some(function (x) { return x.severity === 'Problem'; }) ? 'problem' : (iss.some(function (x) { return x.severity === 'Warning'; }) ? 'warn' : '');
  var tip = sh.name + ' · ' + fmt(sh.start) + '–' + fmt(sh.end) + (sh.notes ? '\n' + sh.notes : '') + iss.map(function (x) { return '\n⚠ ' + x.message; }).join('');
  var focus = S.focus ? (sh.name === S.focus ? ' focus' : ' dim') : '';
  return '<div class="blk ' + sev + focus + '" data-id="' + esc(sh.id) + '" style="top:' + ((sh.start - R.o) * PPM) + 'px;height:' + ((sh.end - sh.start) * PPM) + 'px;left:' + left + '%;width:calc(' + width + '% - 2px);--c:' + color(sh.name) + '" title="' + esc(tip) + '">' +
    '<i class="h ht" data-h="top"></i><div class="bn">' + esc(sh.name) + (sev ? ' ⚠' : '') + '</div><div class="bt">' + fmtS(sh.start) + '–' + fmtS(sh.end) + '</div><i class="h hb" data-h="bottom"></i></div>';
}

function sidebar() {
  var W = S.week, dept = S.dept, html = '<aside class="side">';
  var people = deptStaff(dept).map(function (p) { return p; });
  W.shifts.forEach(function (s) { if (s.dept === dept && !people.some(function (p) { return p.name === s.name; })) people.push({ name: s.name, cap: 0 }); });
  people.sort(function (a, b) { return a.name.localeCompare(b.name); });

  html += '<div class="card"><h3>Hours this week</h3>';
  if (!people.length) html += '<div class="empty">Set each person’s Dept on the Staff tab.</div>';
  people.forEach(function (p) {
    var h = weekHours(p.name), cap = p.cap || 0, pct = cap ? clamp(h / cap * 100, 0, 100) : clamp(h / 40 * 100, 0, 100);
    var cls = cap && h > cap ? 'bad' : (cap && h > cap * .9 ? 'warn' : '');
    html += '<div class="person' + (S.focus === p.name ? ' on' : '') + '" data-who="' + esc(p.name) + '" title="Click to highlight ' + esc(p.name) + '"><span class="dot" style="--c:' + color(p.name) + '"></span><span class="nm">' + esc(p.name) + '</span>' +
      '<span class="meter ' + cls + '"><i style="width:' + pct + '%"></i></span><small>' + (Math.round(h * 10) / 10) + (cap ? '/' + cap : 'h') + '</small></div>';
  });
  html += '</div>';

  var list = W.warnings.filter(function (x) { return x.dept === dept; });
  html += '<div class="card"><h3>Needs attention (' + list.length + ')</h3>';
  if (!list.length) html += '<div class="empty">Nothing to fix. 🎉</div>';
  list.slice(0, 40).forEach(function (x) {
    html += '<div class="issue ' + x.severity + '" data-shift="' + esc(x.shiftId) + '"><b>' + (x.date ? md(x.date) + (x.person && x.message.indexOf(x.person) < 0 ? ' · ' + esc(x.person) : '') : '') + '</b> ' + esc(x.message) + '<small>' + x.severity + '</small></div>';
  });
  html += '</div>';

  html += '<div class="card"><h3>Legend</h3><div class="legend"><span><i style="background:repeating-linear-gradient(45deg,#e5e7eb,#e5e7eb 4px,#f3f4f6 4px,#f3f4f6 8px);border-left:3px solid #9ca3af"></i>Program (busy)</span>' +
    '<span><i style="background:var(--ok)"></i>Covered</span><span><i style="background:var(--warn)"></i>Understaffed</span><span><i style="background:var(--bad)"></i>No one</span></div>' +
    (canEdit() ? '<p class="empty" style="margin:8px 0 0">Drag on an empty spot to add a shift. Drag a shift to move it; drag its top/bottom edge to resize.</p>' : '<p class="empty" style="margin:8px 0 0">You have view-only access to this desk.</p>') + '</div>';
  return html + '</aside>';
}

/* =============== rendering: My Shifts =============== */
function renderMy() {
  var W = S.week;
  if (!W) { $('main').innerHTML = '<div class="empty">Loading…</div>'; return; }
  var who = S.who || me().name || '';
  var opts = '<option value="">— pick your name —</option>' + S.boot.staff.slice().sort(function (a, b) { return a.name.localeCompare(b.name); }).map(function (p) { return '<option' + (p.name === who ? ' selected' : '') + '>' + esc(p.name) + '</option>'; }).join('');
  var html = '<div class="my"><div class="card" style="margin-bottom:10px"><label>Showing schedule for <select id="whoSel">' + opts + '</select></label></div>';
  if (!who) html += '<div class="card empty">Pick your name to see your desk shifts and the programs you’re running this week.</div>';
  else {
    var total = 0;
    W.days.forEach(function (d) {
      var items = [];
      W.shifts.forEach(function (s) { if (s.name === who && s.date === d) { items.push({ a: s.start, kind: 'shift', t: fmt(s.start) + ' – ' + fmt(s.end), label: s.dept + ' Desk', note: s.notes }); total += (s.end - s.start) / 60; } });
      W.programs.forEach(function (p) { if (p.date === d && p.staff.indexOf(who) >= 0) items.push({ a: p.busyStart, kind: 'prog', t: fmt(p.busyStart) + ' – ' + fmt(p.busyEnd), label: p.name, note: p.room }); });
      W.timeOff.forEach(function (t) { if (t.name === who && d >= t.start && d <= t.end) items.push({ a: -1, kind: 'off', t: 'All day', label: '🏖 Time off' }); });
      items.sort(function (x, y) { return x.a - y.a; });
      html += '<div class="myday' + (d === S.boot.today ? ' today' : '') + '"><h4><span>' + DAYS[dow(d)] + ' ' + md(d) + '</span>' + (isClosed(d) ? '<span class="empty">Library closed</span>' : '') + '</h4>';
      if (!items.length) html += '<div class="myitem empty">—</div>';
      items.forEach(function (i) { html += '<div class="myitem"><span class="t">' + i.t + '</span><span class="tag' + (i.kind === 'prog' ? ' prog' : '') + '">' + (i.kind === 'shift' ? 'DESK' : i.kind === 'prog' ? 'PROGRAM' : 'OFF') + '</span><span>' + esc(i.label) + (i.note ? ' <span class="empty">· ' + esc(i.note) + '</span>' : '') + '</span></div>'; });
      html += '</div>';
    });
    html += '<div class="empty" style="text-align:center">Desk hours this week: <b>' + (Math.round(total * 10) / 10) + '</b></div>';
  }
  $('main').innerHTML = html + '</div>';
}

function renderAll() {
  renderChrome();
  if (S.view === 'schedule') renderSchedule(); else renderMy();
}

/* =============== shift dialog =============== */
function openDialog(sh) {
  var isNew = !sh.id;
  var dept = sh.dept || S.dept, editable = !!me().edit[dept];
  var staff = S.boot.staff.slice().sort(function (a, b) {
    var ra = (a.dept === dept || a.dept === 'Both') ? 0 : 1, rb = (b.dept === dept || b.dept === 'Both') ? 0 : 1;
    return ra - rb || a.name.localeCompare(b.name);
  });
  var opts = '<option value="">— choose —</option>' + staff.map(function (p) { return '<option' + (p.name === sh.name ? ' selected' : '') + '>' + esc(p.name) + (p.dept && p.dept !== 'Both' && p.dept !== dept ? ' (' + p.dept + ')' : '') + '</option>'; }).join('');
  var dis = editable ? '' : ' disabled';
  $('dlg').innerHTML = '<form method="dialog" id="f"><h2>' + (isNew ? 'New' : (editable ? 'Edit' : 'View')) + ' ' + dept + ' desk shift</h2>' +
    '<label>Person<select id="fName"' + dis + '>' + opts + '</select></label>' +
    '<label>Date<input type="date" id="fDate" value="' + sh.date + '"' + dis + '></label>' +
    '<div class="row"><label>Start<input type="time" id="fStart" step="900" value="' + toInput(sh.start) + '"' + dis + '></label><label>End<input type="time" id="fEnd" step="900" value="' + toInput(sh.end) + '"' + dis + '></label></div>' +
    '<label>Notes (optional)<input id="fNotes" maxlength="200" value="' + esc(sh.notes || '') + '"' + dis + '></label>' +
    '<div id="conf"></div><div class="acts">' + (!isNew && editable ? '<button type="button" class="btn danger left" id="fDel">Delete</button>' : '') +
    '<button type="button" class="btn" id="fCancel">' + (editable ? 'Cancel' : 'Close') + '</button>' + (editable ? '<button type="submit" class="btn primary" id="fSave">Save</button>' : '') + '</div></form>';

  function read() {
    var nm = $('fName').value.replace(/ \((AS|YS)\)$/, '');
    return { id: sh.id || '', dept: dept, name: nm, date: $('fDate').value, start: fromInput($('fStart').value), end: fromInput($('fEnd').value), notes: $('fNotes').value };
  }
  function live() {
    var v = read(), msgs = [];
    if (v.end <= v.start) msgs.push('End time must be after start time');
    else msgs = conflictsFor(v);
    $('conf').innerHTML = !v.name ? '' : (msgs.length ? msgs.map(function (m) { return '<div class="c">⚠ ' + esc(m) + '</div>'; }).join('') : '<div class="ok">✓ No conflicts found</div>');
  }
  ['fName', 'fDate', 'fStart', 'fEnd'].forEach(function (id) { $(id).addEventListener('input', live); });
  live();
  $('fCancel').onclick = function () { $('dlg').close(); };
  if ($('fDel')) $('fDel').onclick = function () {
    $('dlg').close(); S.busy = true; renderAll();
    call('api_deleteShift', sh.id, dept, S.weekStart).then(function (w) { applyWeek(w); toast('Shift deleted'); }).catch(fail);
  };
  $('f').onsubmit = function (e) {
    e.preventDefault();
    var v = read();
    if (!v.name) { toast('Pick a person first', true); return; }
    $('dlg').close(); S.busy = true; renderAll();
    call('api_saveShift', v, S.weekStart).then(function (w) { applyWeek(w); toast('Saved'); }).catch(fail);
  };
  $('dlg').showModal();
}

/* =============== dragging =============== */
function findShift(id) { return S.week.shifts.filter(function (s) { return s.id === id; })[0]; }
function colAt(x) {
  var cols = document.querySelectorAll('.daycol'), hit = null;
  Array.prototype.forEach.call(cols, function (c) { var r = c.getBoundingClientRect(); if (x >= r.left && x < r.right) hit = c; });
  return hit;
}
function minutesAt(col, y) { var R = range(); return R.o + (y - col.getBoundingClientRect().top) / PPM; }

function hint(text, bad, e) {
  var h = $('hint');
  if (!text) { h.style.display = 'none'; return; }
  h.textContent = text; h.className = bad ? 'bad' : ''; h.style.display = 'block';
  h.style.left = Math.min(e.clientX + 14, window.innerWidth - 330) + 'px'; h.style.top = (e.clientY + 14) + 'px';
}

function onDown(e) {
  if (S.view !== 'schedule' || !canEdit() || e.button > 0 || e.pointerType === 'touch') return;
  var blk = e.target.closest('.blk'), lane = e.target.closest('.shiftlane');
  if (blk) {
    var sh = findShift(blk.dataset.id); if (!sh) return;
    drag = { mode: e.target.dataset.h ? 'resize-' + e.target.dataset.h : 'move', el: blk, orig: sh, cur: Object.assign({}, sh), x0: e.clientX, y0: e.clientY, moved: false };
  } else if (lane) {
    var col = lane.closest('.daycol');
    drag = { mode: 'create', col: col, date: col.dataset.date, anchor: snap(minutesAt(col, e.clientY)), x0: e.clientX, y0: e.clientY, moved: false };
  } else return;
  e.preventDefault();
}

function onMove(e) {
  if (!drag) return;
  if (!drag.moved && Math.abs(e.clientX - drag.x0) + Math.abs(e.clientY - drag.y0) < 5) return;
  drag.moved = true;
  var R = range(), cur;
  if (drag.mode === 'create') {
    var m = snap(minutesAt(drag.col, e.clientY)), a = Math.min(drag.anchor, m), b = Math.max(drag.anchor, m);
    if (b - a < 30) b = a + 30;
    cur = { id: 'new', dept: S.dept, date: drag.date, name: '', start: clamp(a, R.o, R.c - 30), end: clamp(b, R.o + 30, R.c) };
    drag.cur = cur;
    var g = drag.ghost;
    if (!g) { g = drag.ghost = document.createElement('div'); g.className = 'blk ghost'; drag.col.querySelector('.shiftlane').appendChild(g); }
    g.style.top = ((cur.start - R.o) * PPM) + 'px'; g.style.height = ((cur.end - cur.start) * PPM) + 'px'; g.style.left = '0'; g.style.width = 'calc(100% - 2px)';
    g.innerHTML = '<div class="bn">New shift</div><div class="bt">' + fmtS(cur.start) + '–' + fmtS(cur.end) + '</div>';
    hint(fmt(cur.start) + ' – ' + fmt(cur.end), false, e);
    return;
  }
  var o = drag.orig; cur = Object.assign({}, o);
  var dMin = snap((e.clientY - drag.y0) / PPM);
  if (drag.mode === 'move') {
    var len = o.end - o.start;
    cur.start = clamp(o.start + dMin, R.o, R.c - len); cur.end = cur.start + len;
    var col = colAt(e.clientX);
    if (col) { cur.date = col.dataset.date; var lane = col.querySelector('.shiftlane'); if (drag.el.parentNode !== lane) { lane.appendChild(drag.el); drag.el.style.left = '0'; drag.el.style.width = 'calc(100% - 2px)'; } }
  } else if (drag.mode === 'resize-top') {
    cur.start = clamp(o.start + dMin, R.o, o.end - 30);
  } else {
    cur.end = clamp(o.end + dMin, o.start + 30, R.c);
  }
  drag.cur = cur;
  drag.el.classList.add('dragging');
  drag.el.style.top = ((cur.start - R.o) * PPM) + 'px'; drag.el.style.height = ((cur.end - cur.start) * PPM) + 'px';
  drag.el.querySelector('.bt').textContent = fmtS(cur.start) + '–' + fmtS(cur.end);
  var c = conflictsFor(cur);
  drag.el.classList.toggle('bad', c.length > 0);
  hint(c.length ? '⚠ ' + c[0] + (c.length > 1 ? ' (+' + (c.length - 1) + ' more)' : '') : fmt(cur.start) + ' – ' + fmt(cur.end), c.length > 0, e);
}

function onUp() {
  if (!drag) return;
  var d = drag; drag = null; hint(null);
  if (!d.moved) return;                           // a plain click: handled by onClick
  suppressClick = true; setTimeout(function () { suppressClick = false; }, 0);
  if (d.mode === 'create') { if (d.ghost) d.ghost.remove(); openDialog(d.cur.start != null ? { dept: S.dept, date: d.cur.date, start: d.cur.start, end: d.cur.end, name: '', notes: '' } : null); return; }
  var c = d.cur, o = d.orig;
  if (c.start === o.start && c.end === o.end && c.date === o.date) { renderAll(); return; }
  S.busy = true; renderAll();
  call('api_saveShift', { id: o.id, dept: o.dept, name: o.name, date: c.date, start: c.start, end: c.end, notes: o.notes }, S.weekStart)
    .then(function (w) {
      applyWeek(w);
      var bad = shiftIssues(o.id).filter(function (x) { return x.severity === 'Problem'; });
      if (bad.length) toast('Saved, but: ' + bad[0].message, true); else toast('Moved ✓');
    }).catch(fail);
}

function onClick(e) {
  if (suppressClick || S.view !== 'schedule') return;
  var blk = e.target.closest('.blk');
  if (blk && !blk.classList.contains('ghost')) { var sh = findShift(blk.dataset.id); if (sh) openDialog(sh); return; }
  var lane = e.target.closest('.shiftlane');
  if (lane && canEdit()) {
    var col = lane.closest('.daycol'), R = range(), start = clamp(snap(minutesAt(col, e.clientY)), R.o, R.c - 60);
    openDialog({ dept: S.dept, date: col.dataset.date, start: start, end: start + 60, name: '', notes: '' });
  }
}

/* =============== wiring =============== */
function shiftWeek(n) { S.weekStart = addDays(S.weekStart, 7 * n); loadWeek(S.weekStart); }

document.addEventListener('click', function (e) {
  var t = e.target;
  if (t.closest('#prev')) return shiftWeek(-1);
  if (t.closest('#next')) return shiftWeek(1);
  if (t.closest('#today')) { S.mobileDay = dow(S.boot.today); return loadWeek(S.boot.today); }
  var seg = t.closest('#deptSeg button'); if (seg) { S.dept = seg.dataset.dept; S.focus = null; store('dept', S.dept); return renderAll(); }
  var tab = t.closest('#viewTabs button'); if (tab) { S.view = tab.dataset.view; return renderAll(); }
  var pill = t.closest('#daypills button'); if (pill) { S.mobileDay = +pill.dataset.i; return renderAll(); }
  var p = t.closest('.person'); if (p) { S.focus = S.focus === p.dataset.who ? null : p.dataset.who; return renderAll(); }
  var iss = t.closest('.issue');
  if (iss) {
    var id = iss.dataset.shift; if (!id) return;
    var el = document.querySelector('.blk[data-id="' + id + '"]');
    if (el) { el.scrollIntoView({ block: 'center', behavior: 'smooth' }); el.animate([{ outline: '4px solid #111827' }, { outline: '0 solid transparent' }], { duration: 900 }); }
    return;
  }
  if (t.closest('#btnRefresh')) {
    S.busy = true; renderAll(); toast('Reading the programs sheet…');
    return call('api_refreshPrograms').then(function (r) {
      return call('api_boot').then(function (b) { S.boot = b; toast('Loaded ' + r.blocks + ' program-days'); return loadWeek(S.weekStart); });
    }).catch(fail);
  }
  if (t.closest('#btnPublish')) {
    if (!window.confirm('Publish this week’s ' + S.dept + ' desk shifts (' + nice(S.week.start) + ' – ' + nice(S.week.end) + ') to Google Calendar?\n\nIt updates events it made before and never touches events added by hand.')) return;
    S.busy = true; renderAll();
    return call('api_publishWeek', S.weekStart, S.dept).then(function (r) { S.busy = false; renderAll(); toast('Published to “' + r.calendar + '”: ' + r.created + ' new, ' + r.updated + ' updated, ' + r.deleted + ' removed'); }).catch(fail);
  }
  onClick(e);
});
document.addEventListener('change', function (e) {
  if (e.target.id === 'showOther') { S.showOther = e.target.checked; renderAll(); }
  if (e.target.id === 'whoSel') { S.who = e.target.value; store('who', S.who); renderAll(); }
});
document.addEventListener('pointerdown', onDown);
document.addEventListener('pointermove', onMove);
document.addEventListener('pointerup', onUp);
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && drag) { if (drag.ghost) drag.ghost.remove(); drag = null; hint(null); renderAll(); } });
mobile.addEventListener ? mobile.addEventListener('change', function () { if (S.boot) renderAll(); }) : null;

/* =============== start =============== */
call('api_boot').then(function (b) {
  S.boot = b;
  var e = b.me.edit;
  S.dept = (e.YS && !e.AS) ? 'YS' : (e.AS && !e.YS) ? 'AS' : (store('dept') || 'AS');
  S.who = store('who') || '';
  S.weekStart = weekStart(b.today);
  S.mobileDay = dow(b.today);
  return loadWeek(S.weekStart);
}).catch(function (e) {
  $('main').innerHTML = '<div class="card" style="margin:16px"><b>Could not start.</b><p>' + esc(errMsg(e)) + '</p><p class="empty">If this is a fresh install: open the Google Sheet and run 📅 Scheduler → 1. Set up / repair tabs once.</p></div>';
});
})();
</script>
</body>
</html>
